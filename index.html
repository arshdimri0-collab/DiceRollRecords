<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Records</title>
    <style>
        /* Base Styles & Retro Color Palette */
        :root {
            --bg-color: #fcfcfc;
            --text-color: #111111;
            --accent-red: #e62b1e;
            --border-color: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: min-content;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Container */
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        /* Logo Component (Recreated in Pure HTML/CSS) */
        .logo-box {
            width: 180px;
            height: 180px;
            border: 4px solid var(--border-color);
            margin: 0 auto 24px auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 10px;
            background: #ffffff;
            position: relative;
        }

        .logo-title {
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent-red);
            text-transform: uppercase;
        }

        /* The iconic 1-pip / Japanese flag red dot */
        .logo-dot {
            width: 52px;
            height: 52px;
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        .logo-sub {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-color);
        }

        .estd {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Main Content & Release Card */
        .release-card {
            border: 2px solid var(--border-color);
            padding: 24px;
            background: #ffffff;
            margin-bottom: 32px;
            text-align: left;
        }

        .release-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-red);
            margin-bottom: 8px;
        }

        .release-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .release-meta {
            font-size: 14px;
            color: #555;
            margin-bottom: 16px;
        }

        .tracklist {
            list-style: none;
            border-top: 1px solid #eee;
            padding-top: 12px;
            margin-bottom: 20px;
        }

        .tracklist li {
            font-size: 14px;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
        }

        /* Buttons & Links */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--text-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            border: 2px solid var(--text-color);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: var(--text-color);
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        footer a {
            color: var(--text-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Dice Roll Logo -->
        <div class="logo-box">
            <div class="logo-title">DICE ROLL</div>
            <div class="logo-dot"></div>
            <div class="logo-sub">RECORDS.</div>
        </div>
        <div class="estd">ESTD. 2026</div>

        <!-- Featured Release Card -->
        <div class="release-card">
            <div class="release-tag">CATALOG #001</div>
            <h2 class="release-title">NEON — EP</h2>
            <div class="release-meta">3-Track Original EP</div>
            
            <ul class="tracklist">
                <li><span>01. Going Nowhere</span> </li>
                <li><span>02. Kaleidoscope of Colours</span> </li>
                <li><span>03. Smash My Head Through the Stars</span> </li>
            </ul>

            <div class="btn-group">
                <a href="#" class="btn" target="_blank">Listen on Spotify</a>
                <a href="#" class="btn" target="_blank">Listen on Apple Music</a>
                <a href="#" class="btn" target="_blank">Bandcamp / Stream</a>
            </div>
        </div>

        <!-- Links Footer -->
        <footer>
            <p>℗ 2026 Dice Roll. All rights reserved.</p>
            <p style="margin-top: 8px;">Contact: <a href="mailto:contact@diceroll.com">contact@diceroll.com</a></p>
        </footer>

    </div>

</body>
</html>
