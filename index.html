
            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Records</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #111111;
            --accent-red: #e62b1e;
            --border-color: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: min-content;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        /* Logo Component */
        .logo-box {
            width: 200px;
            height: 200px;
            border: 4px solid var(--border-color);
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px 16px 10px;
            background: #ffffff;
            position: relative;
        }

        .curved-svg {
            width: 100%;
            height: 75px;
            overflow: visible;
        }

        .curved-text {
            font-family: "Times New Roman", Times, serif;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 3px;
            fill: var(--accent-red);
            text-anchor: middle;
        }

        .logo-dot {
            width: 54px;
            height: 54px;
            background-color: var(--accent-red);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-sub {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-color);
            z-index: 2;
        }

        .estd {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Release Cards */
        .release-card {
            border: 2px solid var(--border-color);
            padding: 24px;
            background: #ffffff;
            margin-bottom: 24px;
            text-align: left;
        }

        .release-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-red);
            margin-bottom: 8px;
        }

        .release-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .release-artist {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 16px;
        }

        /* Buttons & Links */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--text-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            border: 2px solid var(--text-color);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: var(--text-color);
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        footer a {
            color: var(--text-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Dice Roll Logo with Curved Text -->
        <div class="logo-box">
            <svg class="curved-svg" viewBox="0 0 200 80">
                <path id="text-curve" d="M 20,70 A 80,80 0 0,1 180,70" fill="transparent" />
                <text class="curved-text">
                    <textPath href="#text-curve" startOffset="50%">
                        DICE ROLL
                    </textPath>
                </text>
            </svg>
            
            <div class="logo-dot"></div>
            <div class="logo-sub">RECORDS.</div>
        </div>
        
        <div class="estd">ESTD. 2026</div>

        <!-- Release 01 -->
        <div class="release-card">
            <div class="release-tag">CATALOG #001</div>
            <h2 class="release-title">Boys Like You</h2>
            <div class="release-artist">by Arsh Dimri</div>

            <div class="btn-group">
                <a href="https://spotify.com" class="btn" target="_blank">Listen on Spotify</a>
                <a href="https://apple.com" class="btn" target="_blank">Listen on Apple Music</a>
            </div>
        </div>

        <!-- Release 02 -->
        <div class="release-card">
            <div class="release-tag">CATALOG #002</div>
            <h2 class="release-title">Improper Codings</h2>
            <div class="release-artist">by Arsh Dimri</div>

            <div class="btn-group">
                <a href="https://spotify.com" class="btn" target="_blank">Listen on Spotify</a>
                <a href="https://apple.com" class="btn" target="_blank">Listen on Apple Music</a>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>℗ 2026 Dice Roll. All rights reserved.</p>
            <p style="margin-top: 8px;">Contact: <a href="mailto:contact@diceroll.com">contact@diceroll.com</a></p>
        </footer>

    </div>

</body>
</html>
